html,body{margin:0;position:fixed;inset:0;background:#000;overflow:hidden;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:absolute;left:0;top:0}
canvas{display:block;touch-action:none;cursor:crosshair}
#safe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
#panel{position:fixed;top:60px;right:12px;width:440px;max-height:calc(100vh - 120px);overflow:auto;background:rgba(4,6,5,.97);border:1px solid #7dffc8;box-shadow:0 0 18px rgba(125,255,200,.25);color:#cfd8d4;font-size:13px;line-height:1.5;padding:14px 16px;display:none;z-index:8;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#panel h1{font-size:16px;text-transform:uppercase;color:#7dffc8;margin:0 0 8px;letter-spacing:.5px;padding-right:44px}
#panel h2{font-size:12px;text-transform:uppercase;color:#f5f542;margin:14px 0 4px;letter-spacing:.5px}
#panel ul{margin:4px 0;padding-left:16px}#panel li{margin:3px 0}#panel p{margin:6px 0}
#panel a{color:#34e6e6;text-decoration:none;cursor:pointer}#panel a.ml{color:#f5f542}
#panel em{color:#8a948f;font-style:normal}#panel strong{color:#fff}
#panel .x{position:sticky;float:right;top:0;color:#ff3fbf;cursor:pointer;font-size:15px;padding:4px 6px;background:rgba(4,6,5,.9)}
#panel .meta{color:#ff3fbf;font-size:11px;margin-bottom:6px}
#ctl{position:fixed;z-index:7;display:flex;gap:6px;flex-wrap:wrap;max-width:78vw;justify-content:flex-end}
#ctl button{font:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(6,10,8,.9);color:#7dffc8;border:1px solid #7dffc8;padding:5px 9px;cursor:pointer;box-shadow:0 0 10px rgba(125,255,200,.25)}
#ctl button.off{color:#ff3fbf;border-color:#ff3fbf;box-shadow:0 0 10px rgba(255,63,191,.3)}
#sbox{position:fixed;z-index:9;display:none;background:rgba(4,6,5,.97);border:1px solid #f5f542;box-shadow:0 0 18px rgba(245,245,66,.2)}
#sbox .row1{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #2a2f2a;color:#f5f542}
#sbox input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:16px;caret-color:#ff3fbf;min-width:0}
#sbox .cl{color:#ff3fbf;cursor:pointer;padding:2px 6px}
#sres{max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch}
#sres div{padding:8px 10px;border-bottom:1px solid #1b1f1b;cursor:pointer;font-size:12.5px;color:#e9ece6}
#sres div:active,#sres div.on{background:#132018}
#sres b{font-weight:400;font-size:10px;padding:1px 5px;margin-right:6px;color:#060806}
#sres i{display:block;font-style:normal;color:#8b918a;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gate{position:fixed;inset:0;background:#000;color:#cfd8d4;z-index:20;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
#gate .box{width:100%;max-width:420px;border:1px solid #2a3a30;background:#050706;padding:18px 16px;box-shadow:0 0 24px rgba(93,255,122,.12)}
#gate .ttl{color:#5dff7a;font-weight:800;font-size:22px;letter-spacing:1px}#gate .ttl b{color:#ff3fbf}
#gate .dim{color:#6c736c;font-size:12px;margin:4px 0 16px}
#gate label.p{display:flex;align-items:center;gap:8px;border-bottom:1px solid #5dff7a;padding:6px 0;font-size:15px}
#gate input[type=password]{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:16px;caret-color:#ff3fbf;min-width:0}
#gate .rem{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:13px;color:#aab0aa}
#gate input[type=checkbox]{accent-color:#5dff7a;width:18px;height:18px}
#gate button{width:100%;background:#5dff7a;color:#041007;border:0;font:inherit;font-weight:800;font-size:15px;padding:12px;letter-spacing:1px;cursor:pointer}
#gate .st{min-height:18px;margin-top:12px;font-size:12px;color:#7dffc8}#gate .st.err{color:#ff3fbf}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (max-width:700px){#panel{left:8px;right:8px;top:auto;width:auto;bottom:calc(env(safe-area-inset-bottom) + 8px);max-height:64vh;font-size:14px}}

<script>
(async()=>{
 const $=id=>document.getElementById(id),st=$('gst');
 const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),e64=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
 const KEY='brain.key.'+(window.ENC&&ENC.id);window.GATE_FAIL=0;
 if(!window.ENC){st.className='st err';st.textContent='no encrypted data in this build (passphrase not set on the box).';$('gbtn').disabled=true;return}
 if(!window.isSecureContext||!crypto.subtle){st.className='st err';st.textContent='needs https to decrypt.';return}
 const unzip=async buf=>{if(ENC.z&&window.DecompressionStream){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}return new Uint8Array(buf)};
 const open=async k=>JSON.parse(new TextDecoder().decode(await unzip(await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(ENC.iv)},k,d64(ENC.ct)))));
 const derive=async p=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])};
 const boot=async g=>{window.GRAPH=g;try{await document.fonts.load('700 12px "JetBrains Mono"')}catch(e){};$('gate').remove();window.startBrain();window.UNLOCKED=true};
 const saved=localStorage.getItem(KEY);
 if(saved){try{const k=await crypto.subtle.importKey('raw',d64(saved),'AES-GCM',false,['decrypt']);return boot(await open(k))}catch(e){localStorage.removeItem(KEY)}}
 $('gform').addEventListener('submit',async ev=>{ev.preventDefault();const pw=$('gpw').value;if(!pw)return;st.className='st';st.textContent='deriving key · pbkdf2 '+(ENC.iter/1000)+'k…';$('gbtn').disabled=true;
   try{const k=await derive(pw);const g=await open(k);if($('grem').checked)localStorage.setItem(KEY,e64(await crypto.subtle.exportKey('raw',k)));st.textContent='ok · decrypted';$('gpw').value='';boot(g)}
   catch(e){window.GATE_FAIL++;st.className='st err';st.textContent='✗ access denied · wrong passphrase';$('gbtn').disabled=false;$('gpw').select()}});
})();
</script></body></html>
